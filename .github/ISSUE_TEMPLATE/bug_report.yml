name: Bug report
description: Something on Suprpod isn't working the way it should
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Suprpod better. Every report gets an acknowledgement within 24 hours.

        **Please don't post passwords, invite codes, or private messages or content here. This tracker is public.**
        Found a security problem? Don't file it here. Use the "Report a security issue" link on the previous screen.

  - type: input
    id: url
    attributes:
      label: Page URL
      description: Where were you when it happened?
      placeholder: https://suprpod.com/...
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you click or do right before it happened?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      description: Your best call. We may adjust it during triage.
      options:
        - "Blocker: I can't do something core (sign in, post, follow) or data was lost"
        - "Major: a feature is broken, but there's a workaround"
        - "Minor: it works, but it's wrong or annoying"
        - "Cosmetic: visual or text issue only"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: For example, Firefox 130 on Windows 11, or Safari on iPhone 15
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console errors
      description: Drag images in here, or paste any red text from your browser console. Optional, but very helpful.
    validations:
      required: false

  - type: input
    id: username
    attributes:
      label: Your Suprpod username (optional)
      description: Lets us credit you in the Tuesday Product Update when it's fixed.
    validations:
      required: false
